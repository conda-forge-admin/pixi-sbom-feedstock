# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.12.0"

package:
  name: pixi-sbom
  version: ${{ version }}

source:
  # pixi-sbom moved to the aesir-oss/pixi-ext-contrib workspace in 1.12.0; its
  # releases are tagged pixi-sbom-vX.Y.Z there.
  url: https://github.com/aesir-oss/pixi-ext-contrib/archive/refs/tags/pixi-sbom-v${{ version }}.tar.gz
  sha256: cfe5ae457121675e9f1f63bebdada4209835d1ec93a8884874dfa36d583e8bbc

build:
  number: 0
  script:
    # The repository root is a Cargo workspace; the crate is crates/pixi-sbom.
    # Cargo.lock and the release profile stay at the root, which cargo uses
    # for a workspace member.
    - if: unix
      then: cargo auditable install --locked --bins --no-track --path crates/pixi-sbom --root "$PREFIX"
      else: cargo auditable install --locked --bins --no-track --path crates/pixi-sbom --root "%LIBRARY_PREFIX%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      # The osx_arm64 package is cross-compiled on an osx_64 runner, which
      # cannot execute the resulting binary ("Bad CPU type in executable").
      - if: build_platform == target_platform
        then:
          - pixi-sbom --version
          - pixi-sbom --help
  - package_contents:
      bin:
        - pixi-sbom
      strict: true

about:
  homepage: https://aesir-oss.github.io/pixi-ext-contrib/
  repository: https://github.com/aesir-oss/pixi-ext-contrib
  documentation: https://aesir-oss.github.io/pixi-ext-contrib/
  summary: Generate a CycloneDX or SPDX SBOM from a pixi.lock file
  description: |
    A pixi extension that writes a CycloneDX 1.6 / 1.7 or SPDX 2.3 / 3.0.1
    JSON Software Bill of Materials for one or more environments of a
    pixi.lock file, with licenses, PyPI identities and a license policy gate.
    Once installed with `pixi global install pixi-sbom`, pixi discovers the
    `pixi-sbom` executable on PATH and exposes it as `pixi sbom`.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - millsks
