bot:
  automerge: true
  # aesir-oss/pixi-sbom tags its releases vX.Y.Z, and release candidates vX.Y.Z-rc.N.
  version_updates:
    allowed_tag_globs: "v*"
conda_build_tool: rattler-build
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
conda_forge_output_validation: true
provider:
  linux_aarch64: default
  osx_arm64: default
